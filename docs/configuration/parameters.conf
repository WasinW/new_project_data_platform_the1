# Project Parameters Configuration
# This file contains all configurable parameters for the data platform project
# Replace the placeholder values with your actual configuration

# =============================================================================
# GOOGLE CLOUD PROJECT CONFIGURATION
# =============================================================================

# Basic Project Information
PROJECT_ID="your-gcp-project-id"
PROJECT_NAME="Your Data Platform Project"
PROJECT_NUMBER="123456789012"
ORGANIZATION_ID="your-organization-id"
DOMAIN="your-domain.com"

# Regional Configuration
REGION="us-central1"
ZONE="us-central1-a"
BIGQUERY_REGION="US"
STORAGE_REGION="us-central1"
BACKUP_REGION="us-east1"
DATAPLEX_REGION="us-central1"
NETWORK_REGION="us-central1"

# =============================================================================
# SERVICE ACCOUNTS CONFIGURATION
# =============================================================================

# Dataflow Service Account
DATAFLOW_SERVICE_ACCOUNT_NAME="dataflow-worker-sa"
DATAFLOW_SERVICE_ACCOUNT_EMAIL="${DATAFLOW_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"

# Airflow/Composer Service Account
AIRFLOW_SERVICE_ACCOUNT_NAME="airflow-scheduler-sa"
AIRFLOW_SERVICE_ACCOUNT_EMAIL="${AIRFLOW_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"

# Monitoring Service Account
MONITORING_SERVICE_ACCOUNT_NAME="monitoring-sa"
MONITORING_SERVICE_ACCOUNT_EMAIL="${MONITORING_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"

# Custom IAM Role
CUSTOM_PIPELINE_ROLE_NAME="data_pipeline_operator"

# User Groups
DATA_ENGINEER_GROUP="data-engineers"
DATA_ANALYST_GROUP="data-analysts"

# =============================================================================
# BIGQUERY CONFIGURATION
# =============================================================================

# Dataset Names
RAW_DATASET_ID="raw_data"
PROCESSED_DATASET_ID="processed_data"
ANALYTICS_DATASET_ID="analytics"
AUDIT_DATASET_ID="audit_logs"

# Table Names
PIPELINE_METADATA_TABLE="pipeline_metadata"
DATA_QUALITY_TABLE="data_quality_results"
AUDIT_LOGS_TABLE="audit_logs"
RAW_TABLE="raw_events"
PROCESSED_TABLE="processed_events"

# BigQuery Job Configuration
BIGQUERY_JOB_TIMEOUT_MS="3600000"
BIGQUERY_MAX_RETRY_COUNT="3"

# =============================================================================
# PUB/SUB CONFIGURATION
# =============================================================================

# Topic Names
INPUT_TOPIC_ID="input-data-topic"
ERROR_TOPIC_ID="error-topic"
AUDIT_TOPIC_ID="audit-topic"
OUTPUT_TOPIC_ID="output-data-topic"

# Subscription Names
PROCESSING_SUBSCRIPTION_ID="processing-subscription"
MONITORING_SUBSCRIPTION_ID="monitoring-subscription"
ERROR_SUBSCRIPTION_ID="error-subscription"

# Pub/Sub Configuration
PUBSUB_MESSAGE_RETENTION_DURATION="604800s"  # 7 days
PUBSUB_ACK_DEADLINE_SECONDS="600"
PUBSUB_MAX_DELIVERY_ATTEMPTS="5"

# =============================================================================
# CLOUD STORAGE CONFIGURATION
# =============================================================================

# Bucket Names
DATA_LAKE_BUCKET_NAME="${PROJECT_ID}-data-lake"
TEMP_BUCKET_NAME="${PROJECT_ID}-temp-processing"
BACKUP_BUCKET_NAME="${PROJECT_ID}-backup-storage"
CONFIG_BUCKET_NAME="${PROJECT_ID}-config"
TERRAFORM_STATE_BUCKET="${PROJECT_ID}-terraform-state"

# Storage Paths
RAW_DATA_PATH="raw"
PROCESSED_DATA_PATH="processed"
ENRICHED_DATA_PATH="enriched"
ARCHIVE_DATA_PATH="archive"
TEMP_DATA_PATH="temp"
CONFIG_PATH="config"

# Lifecycle Management (in days)
LIFECYCLE_NEARLINE_DAYS="30"
LIFECYCLE_COLDLINE_DAYS="90"
LIFECYCLE_DELETE_DAYS="2555"  # 7 years
TEMP_DELETE_DAYS="7"

# =============================================================================
# SECRET MANAGER CONFIGURATION
# =============================================================================

# Secret Names
DATABASE_PASSWORD_SECRET="database-password"
EXTERNAL_API_KEY_SECRET="external-api-key"
SERVICE_ACCOUNT_KEY_SECRET="service-account-key"
ENCRYPTION_KEY_SECRET="data-encryption-key"
SLACK_WEBHOOK_SECRET="slack-webhook-url"

# =============================================================================
# DATAPLEX CONFIGURATION
# =============================================================================

# Dataplex Resources
DATAPLEX_LAKE_ID="primary-data-lake"
RAW_ZONE_ID="raw-data-zone"
CURATED_ZONE_ID="curated-data-zone"
RAW_STORAGE_ASSET_ID="raw-storage-asset"
BIGQUERY_ASSET_ID="bigquery-curated-asset"

# =============================================================================
# DATAFLOW CONFIGURATION
# =============================================================================

# Pipeline Names
HYBRID_PIPELINE_NAME="hybrid-data-pipeline"
RECONCILIATION_PIPELINE_NAME="reconciliation-pipeline"
BATCH_PIPELINE_NAME="batch-processing-pipeline"

# Dataflow Job Configuration
DATAFLOW_TEMP_LOCATION="gs://${TEMP_BUCKET_NAME}/dataflow-temp"
DATAFLOW_STAGING_LOCATION="gs://${TEMP_BUCKET_NAME}/dataflow-staging"
DATAFLOW_NUM_WORKERS="5"
DATAFLOW_MAX_NUM_WORKERS="50"
DATAFLOW_WORKER_MACHINE_TYPE="n1-standard-4"
DATAFLOW_DISK_SIZE_GB="100"
DATAFLOW_NETWORK="${VPC_NETWORK_NAME}"
DATAFLOW_SUBNETWORK="${SUBNET_NAME}"

# Pipeline Options
DATAFLOW_RUNNER="DataflowRunner"
DATAFLOW_USE_RUNNER_V2="true"
DATAFLOW_SDK_WORKER_PARALLELISM="1"
DATAFLOW_AUTOSCALING_ALGORITHM="THROUGHPUT_BASED"

# =============================================================================
# AIRFLOW/COMPOSER CONFIGURATION
# =============================================================================

# Airflow Environment
COMPOSER_ENVIRONMENT_NAME="data-platform-composer"
COMPOSER_LOCATION="${REGION}"
COMPOSER_NODE_COUNT="3"
COMPOSER_MACHINE_TYPE="n1-standard-2"
COMPOSER_DISK_SIZE_GB="30"

# DAG Configuration
DAG_OWNER="data-platform-team"
DAG_EMAIL="data-platform@${DOMAIN}"
DAG_RETRIES="2"
DAG_RETRY_DELAY_MINUTES="5"
DAG_SCHEDULE_INTERVAL="@daily"

# DAG Names
BATCH_DAG_ID="batch_processing_pipeline"
REALTIME_DAG_ID="realtime_trigger_pipeline"
RECONCILIATION_DAG_ID="reconciliation_pipeline"
INITIATE_DAG_ID="initiate_pipeline"

# =============================================================================
# MONITORING & ALERTING CONFIGURATION
# =============================================================================

# Monitoring Configuration
MONITORING_WORKSPACE_ID="${PROJECT_ID}"
LOG_SINK_NAME="audit-log-sink"

# Notification Channels
EMAIL_NOTIFICATION_CHANNEL="email-alerts"
SLACK_NOTIFICATION_CHANNEL="slack-alerts"
ALERT_EMAIL_ADDRESS="alerts@${DOMAIN}"

# Alert Policy Names
DATAFLOW_LATENCY_ALERT="dataflow-window-latency"
BIGQUERY_PERFORMANCE_ALERT="bigquery-storage-write-performance"
PUBSUB_BACKLOG_ALERT="pubsub-backlog"
PIPELINE_ERROR_ALERT="pipeline-error-rate"
SECRET_MANAGER_ALERT="secret-manager-access-failures"

# Alert Thresholds
DATAFLOW_LATENCY_THRESHOLD_SECONDS="300"  # 5 minutes
BIGQUERY_WRITE_THRESHOLD_SECONDS="10"
PUBSUB_BACKLOG_THRESHOLD="1000"
PIPELINE_ERROR_RATE_THRESHOLD="0.05"  # 5%
SECRET_MANAGER_FAILURE_THRESHOLD="5"

# =============================================================================
# NETWORKING CONFIGURATION
# =============================================================================

# VPC Network Configuration
VPC_NETWORK_NAME="${PROJECT_ID}-vpc"
SUBNET_NAME="${PROJECT_ID}-subnet"
SUBNET_CIDR_RANGE="10.0.0.0/24"
DATAFLOW_SUBNET_RANGE="10.0.0.0/24"

# Firewall Rules
DATAFLOW_FIREWALL_RULE="${PROJECT_ID}-dataflow-allow"
DATAFLOW_PORT_RANGE="12345-12346"

# =============================================================================
# APPLICATION CONFIGURATION
# =============================================================================

# Pipeline Configuration
PIPELINE_VERSION="1.0.0"
PIPELINE_ENVIRONMENT="production"
PIPELINE_LOG_LEVEL="INFO"

# Data Processing Configuration
BATCH_SIZE="1000"
WINDOW_SIZE_MINUTES="5"
LATE_DATA_THRESHOLD_MINUTES="10"
WATERMARK_DELAY_SECONDS="30"

# Data Quality Configuration
DATA_QUALITY_THRESHOLD="0.95"  # 95% quality score
DQ_CHECK_INTERVAL_HOURS="1"
DQ_ALERT_THRESHOLD="0.90"  # Alert if quality drops below 90%

# Retention Policies
DATA_RETENTION_DAYS="2555"  # 7 years
LOG_RETENTION_DAYS="90"
METRICS_RETENTION_DAYS="365"

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# Encryption Configuration
KMS_KEY_RING_NAME="${PROJECT_ID}-key-ring"
KMS_CRYPTO_KEY_NAME="data-encryption-key"
KMS_LOCATION="${REGION}"

# Access Control
ENABLE_PRIVATE_GOOGLE_ACCESS="true"
ENABLE_VPC_FLOW_LOGS="true"
ENABLE_CLOUD_NAT="false"

# Audit Configuration
ENABLE_AUDIT_LOGS="true"
AUDIT_LOG_TYPES="ADMIN_READ,DATA_READ,DATA_WRITE"

# =============================================================================
# TERRAFORM CONFIGURATION
# =============================================================================

# Terraform State Configuration
TERRAFORM_LOCK_TABLE="${PROJECT_ID}-terraform-locks"
TERRAFORM_STATE_PREFIX="data-platform"

# Environment-specific configurations
ENVIRONMENT="production"  # Options: development, staging, production

# Development Environment Overrides (when ENVIRONMENT=development)
DEV_PROJECT_ID="${PROJECT_ID}-dev"
DEV_REGION="us-central1"
DEV_DATAFLOW_NUM_WORKERS="1"
DEV_DATAFLOW_MAX_NUM_WORKERS="5"

# Staging Environment Overrides (when ENVIRONMENT=staging)
STAGING_PROJECT_ID="${PROJECT_ID}-staging"
STAGING_REGION="us-central1"
STAGING_DATAFLOW_NUM_WORKERS="2"
STAGING_DATAFLOW_MAX_NUM_WORKERS="10"

# =============================================================================
# FEATURE FLAGS
# =============================================================================

# Feature Toggles
ENABLE_REAL_TIME_PROCESSING="true"
ENABLE_BATCH_PROCESSING="true"
ENABLE_DATA_QUALITY_CHECKS="true"
ENABLE_AUDIT_LOGGING="true"
ENABLE_COST_OPTIMIZATION="true"
ENABLE_ADVANCED_MONITORING="true"

# Integration Flags
ENABLE_DATAPLEX_INTEGRATION="true"
ENABLE_COMPOSER_INTEGRATION="true"
ENABLE_SECRET_MANAGER="true"
ENABLE_PRIVATE_NETWORKING="false"

# =============================================================================
# EXTERNAL INTEGRATIONS (Optional)
# =============================================================================

# External Database Configuration (if applicable)
EXTERNAL_DB_HOST="your-database-host"
EXTERNAL_DB_PORT="5432"
EXTERNAL_DB_NAME="your-database-name"
EXTERNAL_DB_USER="your-database-user"

# External API Configuration (if applicable)
EXTERNAL_API_BASE_URL="https://api.external-service.com"
EXTERNAL_API_VERSION="v1"
EXTERNAL_API_TIMEOUT_SECONDS="30"

# =============================================================================
# DEVELOPMENT & TESTING CONFIGURATION
# =============================================================================

# Local Development
LOCAL_PROJECT_ID="${PROJECT_ID}-local"
LOCAL_EMULATOR_HOST="localhost"
LOCAL_PUBSUB_PORT="8085"
LOCAL_BIGQUERY_PORT="9050"

# Testing Configuration
TEST_DATASET_ID="test_data"
TEST_BUCKET_NAME="${PROJECT_ID}-test"
TEST_TOPIC_ID="test-topic"
TEST_SUBSCRIPTION_ID="test-subscription"

# CI/CD Configuration
BUILD_TRIGGER_NAME="data-platform-build"
BUILD_TIMEOUT_SECONDS="1200"  # 20 minutes
DEPLOY_TIMEOUT_SECONDS="1800"  # 30 minutes

# =============================================================================
# END OF CONFIGURATION
# =============================================================================

# Usage Instructions:
# 1. Copy this file to a secure location
# 2. Replace all placeholder values with your actual configuration
# 3. Source this file before running deployment scripts: source parameters.conf
# 4. Keep this file secure and do not commit sensitive values to version control
# 5. Use different parameter files for different environments (dev, staging, prod)
