# Project Parameters Configuration
# This file contains all configurable parameters for the data platform project
# Replace the placeholder values with your actual configuration

# =============================================================================
# CORE PROJECT CONFIGURATION
# =============================================================================

# Basic Project Information
PROJECT_ID="ntt-test-data-bq-looker"
PROJECT_NAME="Data Platform Project"
PROJECT_NUMBER="434326790648"
ORGANIZATION_ID="1056939237410"
DOMAIN="member"
ENVIRONMENT="dev"

# Regional Configuration
REGION="asia-southeast1"
ZONE="asia-southeast1-a"
BIGQUERY_REGION="ASIA"

# =============================================================================
# SERVICE ACCOUNTS & IAM CONFIGURATION
# =============================================================================

# Service Accounts
DATAFLOW_SERVICE_ACCOUNT_NAME="demo-the1-dataflow-worker-sa"
AIRFLOW_SERVICE_ACCOUNT_NAME="demo-the1-airflow-scheduler-sa"
MONITORING_SERVICE_ACCOUNT_NAME="demo-the1-monitoring-sa"

# IAM Configuration
CUSTOM_PIPELINE_ROLE_NAME="demo_the1_data_pipeline_operator"
DATA_ENGINEER_GROUP="data-engineers"
DATA_ANALYST_GROUP="data-analysts"

# =============================================================================
# SOURCE DATA CONFIGURATION
# =============================================================================

# Source Configuration
SOURCE_PROJECT_ID="${PROJECT_ID}"
SOURCE_DATASET="refined_data"
SOURCE_TABLE="personas"

# =============================================================================
# BIGQUERY CONFIGURATION
# =============================================================================

# Shared Dataset Names (Common for all domains)
RAW_DATASET="raw_data"
STRUCTURE_DATASET="staging_data"
REFINED_DATASET="refined_data"
ANALYTICS_DATASET="analytics_data"
AUDIT_DATASET="audit_logs"
RECONCILE_DATASET="reconcile_temp"
BATCH_CONTROL_DATASET="batch_control"
REFERENCE_DATASET="reference_data"

# Distribution Mapping Tables (Domain prefixed within shared datasets)
RAW_A1_TABLE="${DOMAIN}_raw_a1"
RAW_A2_TABLE="${DOMAIN}_raw_a2"
RAW_A3_TABLE="${DOMAIN}_raw_a3"
REFINED_B1_TABLE="${DOMAIN}_refined_b1"
REFINED_B2_TABLE="${DOMAIN}_refined_b2"
REFINED_C1_TABLE="${DOMAIN}_refined_c1"

# BigQuery Configuration
BIGQUERY_JOB_TIMEOUT_MS="3600000"
BIGQUERY_MAX_RETRY_COUNT="3"

# =============================================================================
# PUB/SUB CONFIGURATION
# =============================================================================

# Shared Topics & Subscriptions (Common for all domains with attributes)
EVENTS_CREATE_TOPIC="data-events-create"
EVENTS_UPDATE_TOPIC="data-events-update" 
EVENTS_DELETE_TOPIC="data-events-delete"
EVENTS_DLQ_TOPIC="data-events-dlq"
EVENTS_SUBSCRIPTION="data-events-processor-sub"

# Pub/Sub Configuration
PUBSUB_MESSAGE_RETENTION_DURATION="604800s"  # 7 days
PUBSUB_ACK_DEADLINE_SECONDS="600"
PUBSUB_MAX_DELIVERY_ATTEMPTS="5"

# =============================================================================
# CLOUD STORAGE CONFIGURATION
# =============================================================================

# Shared Bucket Names (Common with domain subfolders)
DATA_LAKE_BUCKET="${PROJECT_ID}-data-lake"
STAGING_BUCKET="${PROJECT_ID}-staging"
RAW_BUCKET="${PROJECT_ID}-raw"
TEMP_BUCKET="${PROJECT_ID}-dataflow-temp"
CONFIG_BUCKET="${PROJECT_ID}-pipeline-configs"
TERRAFORM_STATE_BUCKET="${PROJECT_ID}-terraform-state"

# Storage Paths (Domain-specific paths within shared buckets)
RAW_DATA_PATH="raw/${DOMAIN}"
PROCESSED_DATA_PATH="processed/${DOMAIN}"
STAGING_DATA_PATH="staging/${DOMAIN}"
TEMP_DATA_PATH="temp"
CONFIG_PATH="config"

# Lifecycle Management (in days)
LIFECYCLE_NEARLINE_DAYS="30"
LIFECYCLE_COLDLINE_DAYS="90" 
LIFECYCLE_DELETE_DAYS="2555"  # 7 years

# =============================================================================
# SECRET MANAGER CONFIGURATION
# =============================================================================

# AWS S3 Integration Secrets
AWS_S3_ACCESS_KEY_SECRET="aws-s3-access-key-id"
AWS_S3_SECRET_ACCESS_KEY_SECRET="aws-s3-secret-access-key"
AWS_S3_BUCKET_NAME_SECRET="aws-s3-bucket-name"

# Service Account & Encryption
BIGQUERY_SERVICE_ACCOUNT_KEY_SECRET="bq-service-account-key"
ENCRYPTION_KEY_SECRET="data-encryption-key"

# External Integrations
SLACK_WEBHOOK_SECRET="slack-webhook-url"

# =============================================================================
# DATAFLOW CONFIGURATION
# =============================================================================

# Pipeline Names
HYBRID_PIPELINE_NAME="hybrid-data-pipeline"
RECONCILIATION_PIPELINE_NAME="reconciliation-pipeline"
BATCH_PIPELINE_NAME="batch-processing-pipeline"

# Dataflow Job Configuration
DATAFLOW_TEMP_LOCATION="gs://${TEMP_BUCKET}/dataflow-temp"
DATAFLOW_STAGING_LOCATION="gs://${TEMP_BUCKET}/dataflow-staging"
DATAFLOW_NUM_WORKERS="5"
DATAFLOW_MAX_NUM_WORKERS="50"
DATAFLOW_WORKER_MACHINE_TYPE="n2-standard-4"
DATAFLOW_DISK_SIZE_GB="100"
DATAFLOW_RUNNER="DataflowRunner"
DATAFLOW_USE_RUNNER_V2="true"

# =============================================================================
# AIRFLOW/COMPOSER CONFIGURATION
# =============================================================================

# Composer Environment (Shared environment for all domains)
COMPOSER_ENVIRONMENT_NAME="data-platform-composer"
COMPOSER_NODE_COUNT="3"
COMPOSER_MACHINE_TYPE="n1-standard-2"

# DAG Configuration
DAG_OWNER="data-platform-team"
DAG_EMAIL="data-platform@${DOMAIN}.com"
DAG_RETRIES="2"
DAG_RETRY_DELAY_MINUTES="5"
DAG_SCHEDULE_INTERVAL="@daily"

# DAG Names
BATCH_DAG_ID="batch_processing_pipeline"
REALTIME_DAG_ID="realtime_trigger_pipeline"
RECONCILIATION_DAG_ID="reconciliation_pipeline"
INITIATE_DAG_ID="initiate_pipeline"

# =============================================================================
# MONITORING & NETWORKING CONFIGURATION
# =============================================================================

# Monitoring & Alerting
ALERT_EMAIL_ADDRESS="alerts@${DOMAIN}.com"
DATAFLOW_LATENCY_THRESHOLD_SECONDS="300"
PIPELINE_ERROR_RATE_THRESHOLD="0.05"

# VPC Network
VPC_NETWORK_NAME="${PROJECT_ID}-vpc"
SUBNET_NAME="${PROJECT_ID}-subnet"
SUBNET_CIDR_RANGE="10.0.0.0/24"

# Security
KMS_KEY_RING_NAME="${PROJECT_ID}-key-ring"
KMS_CRYPTO_KEY_NAME="data-encryption-key"
ENABLE_PRIVATE_GOOGLE_ACCESS="true"
ENABLE_AUDIT_LOGS="true"

# =============================================================================
# PIPELINE PROCESSING CONFIGURATION
# =============================================================================

# Pipeline Settings
PIPELINE_VERSION="1.0.0"
PIPELINE_LOG_LEVEL="INFO"
BATCH_SIZE="1000"

# Windowing Configuration
WINDOWING_ENABLED="true"
WINDOWING_DEFAULT_DURATION_SECONDS="30"
WINDOWING_MESSAGE_INGESTION_DURATION="10"
WINDOWING_TRANSFORMATION_GAP_DURATION="10"
WINDOWING_BATCH_DURATION="300"

# Data Quality & Validation
DATA_VALIDATION_ENABLED="true"
DATA_VALIDATION_MIN_QUALITY_SCORE="70"
DATA_VALIDATION_MAX_FAILED_RULES="2"

# Performance Settings
PERFORMANCE_MAX_WORKERS="20"
PERFORMANCE_MACHINE_TYPE="n2-standard-4"
PERFORMANCE_BATCH_SIZE="500"
PERFORMANCE_WRITE_BATCH_SIZE="1000"

# Error Handling
ERROR_HANDLING_MAX_RETRIES="3"
ERROR_HANDLING_RETRY_DELAY_SECONDS="60"

# =============================================================================
# RECONCILIATION CONFIGURATION
# =============================================================================

# Reconciliation Settings
RECONCILIATION_ENABLED="true"
RECONCILIATION_SCHEDULE="@daily"
RECONCILIATION_S3_PATH_PATTERN="${DOMAIN}/{table_name}/dt={{{{ ds }}}}"
RECONCILIATION_FILE_FORMAT="PARQUET"
RECONCILIATION_TEMP_BUCKET="reconcile-temp"
RECONCILIATION_RESULTS_DATASET="audit_logs"
RECONCILIATION_RESULTS_TABLE="reconciliation_results"

# =============================================================================
# AUDIT & ERROR HANDLING CONFIGURATION
# =============================================================================

# Audit Configuration
AUDIT_ENABLED="true"
AUDIT_PROCESSING_LOGS_TABLE="${PROJECT_ID}.audit_logs.processing_logs"
AUDIT_DATA_LINEAGE_TABLE="${PROJECT_ID}.audit_logs.data_lineage"
AUDIT_BATCH_SIZE="100"

# Error Tables (Using shared audit dataset)
ERROR_FAILED_DEPENDENCIES_TABLE="${PROJECT_ID}.audit_logs.failed_dependencies"
ERROR_FETCH_ERRORS_TABLE="${PROJECT_ID}.audit_logs.fetch_errors"
ERROR_TRANSFORM_ERRORS_TABLE="${PROJECT_ID}.audit_logs.transform_errors"
ERROR_VALIDATION_ERRORS_TABLE="${PROJECT_ID}.audit_logs.validation_errors"

# =============================================================================
# DEPENDENCIES CONFIGURATION
# =============================================================================

# Dependencies
DEPENDENCY_DAILY_ETL_PROJECT="${PROJECT_ID}"
DEPENDENCY_DAILY_ETL_DATASET="batch_control"
DEPENDENCY_DAILY_ETL_TABLE="job_status"
DEPENDENCY_DAILY_ETL_CONDITION="job_name = 'daily_etl' AND status = 'COMPLETED' AND DATE(completion_time) = CURRENT_DATE()"
DEPENDENCY_DAILY_ETL_FAIL_OPEN="false"

DEPENDENCY_REFERENCE_DATA_PROJECT="${PROJECT_ID}"
DEPENDENCY_REFERENCE_DATA_DATASET="reference_data"
DEPENDENCY_REFERENCE_DATA_TABLE="member_segments"
DEPENDENCY_REFERENCE_DATA_CONDITION="DATE(last_updated) = CURRENT_DATE()"
DEPENDENCY_REFERENCE_DATA_FAIL_OPEN="true"

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================

# Development Environment (when ENVIRONMENT=development)
DEV_DATAFLOW_NUM_WORKERS="1"
DEV_DATAFLOW_MAX_NUM_WORKERS="5"
DEV_PERFORMANCE_MAX_WORKERS="5"
DEV_AUDIT_BATCH_SIZE="10"

# Staging Environment (when ENVIRONMENT=staging)
STAGING_DATAFLOW_NUM_WORKERS="2"
STAGING_DATA_VALIDATION_MIN_QUALITY_SCORE="60"

# Production Environment (when ENVIRONMENT=production)
PROD_PERFORMANCE_MAX_WORKERS="50"
PROD_DATA_VALIDATION_MIN_QUALITY_SCORE="85"
PROD_ERROR_HANDLING_MAX_RETRIES="5"

# =============================================================================
# FEATURE FLAGS
# =============================================================================

# Core Features
ENABLE_REAL_TIME_PROCESSING="true"
ENABLE_BATCH_PROCESSING="true"
ENABLE_DATA_QUALITY_CHECKS="true"
ENABLE_AUDIT_LOGGING="true"

# Optional Features  
ENABLE_DATAPLEX_INTEGRATION="true"
ENABLE_SECRET_MANAGER="true"
ENABLE_PRIVATE_NETWORKING="false"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================

